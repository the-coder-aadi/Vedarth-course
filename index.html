  <script>
    // Apply the stored or system theme before paint to avoid a flash.
    try {
      var t = localStorage.getItem('vedarth-theme');

      if (
        t === 'dark' ||
        (!t && matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.documentElement.classList.add('dark');
      }
